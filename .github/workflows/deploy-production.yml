name: Production Deploy (Blacksmith Prebuilt)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & Deploy to Vercel Prod
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.0"

      - name: Install Dependencies
        run: bun install --frozen-lockfile

      - name: Run Workspace Typecheck
        run: bun run typecheck

      - name: Build Web Application
        run: bun run build

      - name: Deploy Prebuilt to Vercel Production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel@39.2.6 pull --yes --environment=production --token=$VERCEL_TOKEN
          npx vercel@39.2.6 build --prod --token=$VERCEL_TOKEN
          npx vercel@39.2.6 deploy --prebuilt --prod --token=$VERCEL_TOKEN
